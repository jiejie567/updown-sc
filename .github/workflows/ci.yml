name: Release checks

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libeigen3-dev libpcl-dev libyaml-cpp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run release preflight
        run: ./scripts/release_check.sh
