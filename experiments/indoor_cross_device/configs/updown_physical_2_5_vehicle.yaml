  dual_z_split_auto_min_keyframes: 20
  origin_height_from_ground: 0.8
  dual_z_low_weight: 0.4
  dual_z_high_weight: 0.6
  min_joint_rings: 2
  absent_upper_fallback_max_local_fraction: 0.05
  absent_upper_fallback_radius: 10.0
  absent_upper_fallback_min_keyframes: 3
  retrieval_height_offset: 0.1
  sector_support_exponent: 0.5
  gravity_canonicalization_enable: true
  vertical_estimation_enable: false
